<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strategy Planning Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app" class="app">
      <!-- Sidebar -->
      <aside class="sidebar" aria-label="Strategy phases">
        <a class="brand" href="#" data-action="home">
          <span class="brand-icon"><img src="assets/c4e3e7d430ce6972ca9ebf5f822d1d1a8b88b8ec.png" alt="MFG" style="position:absolute;height:100%;width:86.8%;left:6.6%;top:-2.38%;"></span>
          <span class="brand-text">
            <strong>Strategy Map</strong>
            <small>Workshop intelligence</small>
          </span>
        </a>
        <nav id="phaseNav" class="phase-nav" aria-label="Phases"></nav>
        <button class="sidebar-toggle" type="button" data-action="toggle-sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </aside>

      <!-- Workspace -->
      <main class="workspace">
        <header class="topbar">
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
          <div class="topbar-actions">
            <button class="search-trigger" type="button" data-action="open-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <span>Search JTBD, enablers…</span>
              <kbd>⌘K</kbd>
            </button>
          </div>
        </header>
        <section id="phaseBanner" class="phase-banner"></section>
        <nav id="subphaseTabs" class="subphase-tabs" aria-label="Subphases"></nav>
        <div id="content" class="content" aria-live="polite"></div>
      </main>
    </div>

    <!-- JTBD Detail Modal -->
    <div id="modalScrim" class="modal-scrim"></div>
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div id="modalContent"></div>
    </div>

    <!-- Search Palette -->
    <div id="searchScrim" class="search-scrim"></div>
    <div id="searchPalette" class="search-palette">
      <div class="search-palette__input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search JTBD, enablers, opportunities…" autocomplete="off">
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Boot: fetch data from API, then load app (falls back to bundled data) -->
    <script src="icons.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
